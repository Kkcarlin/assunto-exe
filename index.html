<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="description" content="ASSUNTO.EXE. Gerador de assuntos para situações em que você definitivamente poderia simplesmente mandar 'oi'.">
  <title>ASSUNTO.EXE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0f;
      --panel: #121419;
      --panel-2: #171920;
      --border: #292d36;
      --text: #f2f3f5;
      --muted: #8e949f;
      --muted-2: #666c77;
      --accent: #dce1e8;
      --accent-text: #101216;
      --success: #b8e5c4;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100svh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      min-height: 100svh;
      padding:
        max(24px, env(safe-area-inset-top))
        clamp(18px, 5vw, 34px)
        max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    header {
      padding-top: 2px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      min-width: 0;
    }

    .logo {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.45rem);
      line-height: 1;
      font-weight: 760;
      letter-spacing: -0.045em;
    }

    .logo::after {
      content: "_";
      color: var(--muted-2);
      animation: blink 1.15s steps(1) infinite;
    }

    .tagline {
      max-width: 560px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(.86rem, 2.8vw, .96rem);
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .counter {
      flex: 0 0 auto;
      padding-top: 2px;
      text-align: right;
      color: var(--muted-2);
      font-size: .72rem;
      line-height: 1.35;
      white-space: nowrap;
    }

    .counter strong {
      display: block;
      color: var(--muted);
      font-weight: 500;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 9vh, 90px) 0 clamp(28px, 7vh, 70px);
    }

    .question-wrap {
      position: relative;
    }

    .question-card {
      min-height: clamp(280px, 48vh, 390px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      display: flex;
      align-items: center;
      box-shadow: 0 22px 60px rgba(0,0,0,.18);
      transition: border-color .2s ease, background .2s ease;
    }

    .question-card:focus-within {
      border-color: #363b46;
    }

    .question {
      margin: 0;
      width: 100%;
      font-size: clamp(1.7rem, 6vw, 3.2rem);
      line-height: 1.09;
      font-weight: 650;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .question.enter {
      animation: questionIn .34s cubic-bezier(.2,.75,.25,1) both;
    }

    .actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 9px;
    }

    .btn {
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      color: var(--text);
      padding: 0 18px;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .035em;
      transition:
        transform .12s ease,
        background .15s ease,
        border-color .15s ease,
        color .15s ease;
    }

    .btn:hover {
      background: var(--panel-2);
      border-color: #353a44;
    }

    .btn:active {
      transform: translateY(1px) scale(.985);
    }

    .btn:focus-visible {
      outline: 2px solid #bfc5ce;
      outline-offset: 3px;
    }

    .btn-primary {
      min-height: 58px;
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      letter-spacing: .045em;
    }

    .btn-primary:hover {
      background: #fff;
      border-color: #fff;
    }

    .btn-primary:active {
      transform: translateY(1px) scale(.99);
    }

    .copy-btn.copied {
      color: var(--success);
      border-color: #36533f;
    }

    .hint {
      min-height: 20px;
      margin-top: 13px;
      text-align: center;
      color: var(--muted-2);
      font-size: .72rem;
      letter-spacing: .02em;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .hint.show {
      opacity: 1;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      color: var(--muted-2);
      font-size: .7rem;
      letter-spacing: .02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #737984;
    }

    .footer-note {
      text-align: right;
    }

    @keyframes questionIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (max-width: 520px) {
      .app {
        padding-left: 16px;
        padding-right: 16px;
      }

      header {
        gap: 12px;
      }

      .counter {
        font-size: .66rem;
      }

      main {
        padding-top: 35px;
        padding-bottom: 25px;
      }

      .question-card {
        min-height: min(49svh, 360px);
        padding: 27px 23px;
        border-radius: 19px;
      }

      .question {
        font-size: clamp(1.72rem, 8vw, 2.35rem);
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .btn-primary {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      .btn {
        min-height: 48px;
        padding: 0 13px;
      }

      footer {
        font-size: .66rem;
      }
    }

    @media (max-height: 700px) and (max-width: 520px) {
      main {
        padding-top: 25px;
        padding-bottom: 18px;
      }

      .question-card {
        min-height: 250px;
      }

      .question {
        font-size: clamp(1.55rem, 7vw, 2rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1 class="logo">ASSUNTO.EXE</h1>
        <p class="tagline">Gerador de assuntos para situações em que você definitivamente poderia simplesmente mandar “oi”.</p>
      </div>
      <div class="counter" aria-live="polite">
        <strong>Assuntos gerados:</strong>
        <span id="count">0</span>
      </div>
    </header>

    <main>
      <section class="question-wrap" aria-label="Assunto atual">
        <div class="question-card">
          <p id="question" class="question" aria-live="polite"></p>
        </div>

        <div class="actions">
          <button id="generate" class="btn btn-primary" type="button">GERAR ASSUNTO</button>
          <button id="other" class="btn" type="button">OUTRO</button>
          <button id="copy" class="btn copy-btn" type="button">COPIAR</button>
        </div>

        <div id="hint" class="hint" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <span class="status"><span class="status-dot"></span> pronto para uso</span>
      <span class="footer-note">sem contexto necessário.</span>
    </footer>
  </div>

      "Qual foi a coisa mais estranha que você já presenciou em público?",
      "Qual foi uma experiência que você achou que seria ruim e acabou adorando?",
      "Qual história sua sempre volta quando alguém pergunta sobre uma situação absurda?",

      // Potencial de flerte, minoria
      "Qual é uma coisa que faz uma pessoa ficar imediatamente mais interessante?",
      "Qual é o melhor tipo de convite que alguém pode fazer?",
      "Você acha que química dá para perceber rápido?",
      "Qual é a diferença entre achar alguém bonito e realmente sentir atração?",
      "Qual detalhe pequeno pode mudar completamente a primeira impressão sobre alguém?",
      "O que torna uma conversa inesperadamente boa?",
      "Você acha que uma pessoa pode ficar mais atraente depois de conversar bastante com ela?",
      "Qual é o tipo de humor que mais facilmente faz alguém parecer interessante?",
      "Você acha que olhar diz alguma coisa ou a gente inventa significado depois?",
      "Qual é a coisa mais charmosa que alguém pode fazer sem perceber?"
    ];

    const questionEl = document.getElementById("question");
    const countEl = document.getElementById("count");
    const hintEl = document.getElementById("hint");
    const generateBtn = document.getElementById("generate");
    const otherBtn = document.getElementById("other");
    const copyBtn = document.getElementById("copy");

    let deck = [];
    let currentQuestion = "";
    let generatedCount = 0;
    let lastQuestion = "";

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function refillDeck() {
      deck = shuffle(QUESTIONS);

      // Evita que o primeiro item de um novo ciclo seja igual ao último.
      if (deck.length > 1 && deck[0] === lastQuestion) {
        [deck[0], deck[1]] = [deck[1], deck[0]];
      }
    }

    function nextQuestion() {
      if (deck.length === 0) refillDeck();

      let next = deck.pop();

      // Proteção extra contra repetição imediata, inclusive em futuras alterações do banco.
      if (next === currentQuestion && deck.length > 0) {
        const alternativeIndex = deck.findIndex(q => q !== currentQuestion);
        if (alternativeIndex >= 0) {
          [next, deck[alternativeIndex]] = [deck[alternativeIndex], next];
        }
      }

      currentQuestion = next;
      lastQuestion = next;
      generatedCount++;
      countEl.textContent = generatedCount;

      questionEl.classList.remove("enter");
      void questionEl.offsetWidth;
      questionEl.textContent = currentQuestion;
      questionEl.classList.add("enter");

      copyBtn.classList.remove("copied");
      copyBtn.textContent = "COPIAR";
      hideHint();
    }

    function showHint(message) {
      hintEl.textContent = message;
      hintEl.classList.add("show");
    }

    function hideHint() {
      hintEl.classList.remove("show");
      window.clearTimeout(hideHint.timer);
    }

    function copyQuestion() {
      if (!currentQuestion) return;

      const done = () => {
        copyBtn.classList.add("copied");
        copyBtn.textContent = "COPIADO";
        showHint("Copiado.");
        window.clearTimeout(copyQuestion.timer);
        copyQuestion.timer = window.setTimeout(() => {
          copyBtn.classList.remove("copied");
          copyBtn.textContent = "COPIAR";
          hideHint();
        }, 1800);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentQuestion).then(done).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        const area = document.createElement("textarea");
        area.value = currentQuestion;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try {
          document.execCommand("copy");
          done();
        } catch {
          showHint("Selecione e copie a pergunta.");
        }
        area.remove();
      }
    }

    generateBtn.addEventListener("click", nextQuestion);
    otherBtn.addEventListener("click", nextQuestion);
    copyBtn.addEventListener("click", copyQuestion);

    // Começa com uma pergunta carregada. O contador conta assuntos exibidos.
    refillDeck();
    nextQuestion();
  </script>
</body>
</html>
